<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="35%" stop-color="#e5c158" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Black Background -->
  <rect width="600" height="600" fill="#0b0b0e" rx="24" />

  <!-- Top Title -->
  <text x="300" y="85" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    MerLiz Holdings
  </text>
  <text x="300" y="130" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">
    (PTY) Ltd
  </text>

  <!-- 3 Diagonal Parallel Gold Bars -->
  <g fill="url(#goldGrad)">
    <!-- Bar 1 (Upper) -->
    <polygon points="325,185 325,235 200,360 200,310" />
    <!-- Bar 2 (Middle) -->
    <polygon points="375,205 375,255 200,430 200,380" />
    <!-- Bar 3 (Lower) -->
    <polygon points="375,280 375,330 250,455 250,405" />
  </g>

  <!-- Tagline -->
  <text x="300" y="505" font-family="'Cinzel', 'Times New Roman', serif" font-size="32" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">
    Taking you there
  </text>

  <!-- Registration & Contact -->
  <text x="300" y="550" font-family="'Courier New', monospace, sans-serif" font-size="18" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    Reg. Nr 2023 / 527022 / 07
  </text>
  <text x="300" y="575" font-family="'Courier New', monospace, sans-serif" font-size="18" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    Contact +27663758904
  </text>
</svg>
